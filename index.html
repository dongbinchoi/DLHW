<!DOCTYPE html>
<html>

<head>
    <title>SIUUUU WORD MACHINE</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #050505, #171717, #050505);
            color: white;
            min-height: 100vh;
        }

        /* 상단 CR7 */
        .top {
            padding: 25px 10px 10px;
        }

        .cr7 {
            font-size: 70px;
            font-weight: 900;
            color: #d4af37;
            letter-spacing: 5px;
            text-shadow: 0 0 15px #d4af37;
        }

        .subtitle {
            color: #aaa;
            font-size: 18px;
            letter-spacing: 3px;
        }

        /* 호날두 사진 */
        .ronaldo-photo {
            width: 260px;
            height: 260px;
            object-fit: cover;
            border-radius: 50%;
            border: 7px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
            margin: 15px auto;
            display: block;
        }

        /* 7 */
        .number-seven {
            font-size: 100px;
            font-weight: 900;
            color: white;
            text-shadow:
                4px 4px 0 #d4af37,
                0 0 25px #d4af37;
            line-height: 0.9;
        }

        .machine {
            max-width: 700px;
            margin: 25px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid #d4af37;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }

        #question {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* 버튼 전체 */
        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        button {
            font-size: 20px;
            font-weight: bold;
            padding: 18px 30px;
            cursor: pointer;
            transition: 0.2s;
            border: 3px solid #d4af37;
            color: white;
            background: #111;
        }

        /* 버튼 1 - 둥근 */
        .button1 {
            border-radius: 50px;
        }

        /* 버튼 2 - 네모 */
        .button2 {
            border-radius: 5px;
        }

        /* 버튼 3 - 육각형 느낌 */
        .button3 {
            border-radius: 20px 5px 20px 5px;
        }

        button:hover {
            transform: scale(1.08);
            background: #d4af37;
            color: black;
            box-shadow: 0 0 20px #d4af37;
        }

        button:active {
            transform: scale(0.95);
        }

        #feedback {
            font-size: 30px;
            min-height: 45px;
            margin-top: 25px;
            font-weight: 900;
        }

        #score {
            color: #d4af37;
            font-size: 20px;
            margin-top: 15px;
        }

        .progress {
            color: #aaa;
            margin-bottom: 20px;
        }

        /* SIUUUU */
        .siuuu {
            font-size: 55px;
            font-weight: 900;
            color: #d4af37;
            animation: jump 0.6s infinite alternate;
        }

        @keyframes jump {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-10px);
            }
        }

        .footer {
            margin: 30px;
            color: #777;
            font-size: 14px;
        }

    </style>
</head>


<body>

    <div class="top">

        <div class="cr7">CR7</div>

        <div class="subtitle">
            SIUUUU WORD MACHINE
        </div>

        <img
            class="ronaldo-photo"
            src="https://static.znews.vn/static/topic/person/cristiano-ronaldo.jpg"
            alt="Cristiano Ronaldo">

        <div class="number-seven">
            7
        </div>

    </div>


    <div class="machine">

        <div class="progress" id="progress">
            Question 1 / 5
        </div>

        <p id="question">
            What does "look for" mean?
        </p>


        <div class="buttons">

            <button class="button1" id="button1">
                Search
            </button>

            <button class="button2" id="button2">
                Avoid
            </button>

            <button class="button3" id="button3">
                Watch
            </button>

        </div>


        <h3 id="feedback"></h3>

        <p id="score"></p>

    </div>


    <div class="footer">
        WORK HARD • DREAM BIG • SIUUUU
    </div>



    <script>

        let currentQuestion = 0;

        let correctAnswers = 0;


        const questions = [

            {
                word: "look for",
                answer: "search",
                choices: ["Search", "Avoid", "Watch"]
            },

            {
                word: "huge",
                answer: "big",
                choices: ["Small", "Big", "Slow"]
            },

            {
                word: "rapid",
                answer: "fast",
                choices: ["Slow", "Fast", "Quiet"]
            },

            {
                word: "purchase",
                answer: "buy",
                choices: ["Sell", "Buy", "Borrow"]
            },

            {
                word: "difficult",
                answer: "hard",
                choices: ["Easy", "Hard", "Funny"]
            }

        ];


        const buttons = [

            document.getElementById("button1"),
            document.getElementById("button2"),
            document.getElementById("button3")

        ];


        function showQuestion() {

            let question = questions[currentQuestion];


            document.getElementById("question").innerText =
                'What does "' + question.word + '" mean?';


            document.getElementById("progress").innerText =
                "Question " +
                (currentQuestion + 1) +
                " / " +
                questions.length;


            for (let i = 0; i < 3; i++) {

                buttons[i].innerText =
                    question.choices[i];

                buttons[i].onclick = function () {

                    checkAnswer(
                        question.choices[i].toLowerCase()
                    );

                };

            }


            document.getElementById("feedback").innerText = "";

        }



        function checkAnswer(answer) {

            let question = questions[currentQuestion];


            if (answer === question.answer) {

                correctAnswers++;

                document.getElementById("feedback").innerHTML =
                    '<div class="siuuu">SIUUUU! ⚽</div>';

            }

            else {

                document.getElementById("feedback").innerText =
                    "❌ NOOOO! Answer: " +
                    question.answer;

            }


            currentQuestion++;


            if (currentQuestion < questions.length) {

                setTimeout(function () {

                    showQuestion();

                }, 1200);

            }

            else {

                setTimeout(function () {

                    finishQuiz();

                }, 1200);

            }

        }



        function finishQuiz() {

            document.getElementById("question").innerText =
                "🏆 QUIZ FINISHED! 🏆";


            document.getElementById("progress").innerText =
                "FULL TIME";


            document.getElementById("feedback").innerHTML =
                '<div class="siuuu">SIUUUU!</div>';


            document.getElementById("score").innerText =
                "CR7 SCORE: " +
                correctAnswers +
                " / " +
                questions.length;


            buttons.forEach(function(button) {

                button.style.display = "none";

            });

        }


        showQuestion();

    </script>

</body>

</html>
