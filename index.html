<!DOCTYPE html>
<html>

<head>
    <title>siuuuu word machine</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 26px;
            padding: 18px;
            margin: 5px;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>siuuuu word machine</h1>

    <p>What does "look for" mean?</p>

    <button onclick="checkAnswer('search')">
        Participate in
    </button>

    <button onclick="checkAnswer('avoid')">
        Avoid
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "participate") {
                document.getElementById("feedback").innerText =
                    "Correct! Well done!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "Incorrect. The answer is Participate in.";
            }

        }

    </script>

</body>
</html>
