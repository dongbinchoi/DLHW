<!DOCTYPE html>
<html>

<head>
    <title>siuuuu word machine</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 20px;
            padding: 12px;
            margin: 5px;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>siuuuu word machine</h1>

    <p>What does "look for" mean?</p>

    <button onclick="checkAnswer('search')">
        Search
    </button>

    <button onclick="checkAnswer('avoid')">
        Avoid
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>

    <script>

        function checkAnswer(answer) {

            if (answer === "search") {
                document.getElementById("feedback").innerText =
                    "goat 그자체...!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "메시입니다(틀림).";
            }

        }

    </script>

</body>
</html>
